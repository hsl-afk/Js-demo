<html>
  <head>
    <title>Simple Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <table class="form-table" border="1" cellpading="8">
        <tr>
          <td><p id="reqname" class = "errormsg"></p>
            Name:
            <input
              id="name"
              type="text"
              cols="40"
              placeholder="Your name.."
            />
          </td>
        </tr>
        <tr>
          <td><p id="reqemail" class = "errormsg"></p>Email:
            <input
              id="email"
              type="email"
              cols="40"
              placeholder="john@example.com"
            />
          </td>
        </tr>

        <tr>
          <td><p id="reqgender" class = "errormsg"></p>Gender:
            <input type="radio" name="gender" value="Male" /> Male
            <input type="radio" name="gender" value="Female" /> Female
          </td>
        </tr>

        <tr>
          <td>Hobby:
            <p>
            <input type="checkbox" name="hobby" value="Reading" /> Reading
            <input type="checkbox" name="hobby" value="Travelling" /> Travelling
            <input type="checkbox" name="hobby" value="Sports" /> Sports
            </p>
          </td>
        </tr>

        <tr>
          <td><p id="reqcountry" class = "errormsg"></p>Country:
            <select
              class="shortenedSelect"
              id="countries"
              onchange="updatestates()"
            >
              <option>Select</option>
              <option>India</option>
              <option>USA</option>
            </select>
          </td>
        </tr>

        <tr>
          <td><p id="reqstate" class = "errormsg"></p>State:
            <label for="states"></label>
            <select
              class="shortenedSelect"
              id="states"
              onchange="updatecities()" 
            >
              <option>Select</option>
            </select>
          </td>
        </tr>

        <tr>
          <td><p id="reqcity" class = "errormsg"></p>City:
            <label for="cities"></label>
            <select class="shortenedSelect" id="cities">
              <option>Select</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>
            <button id="saveBtn" type="button" onclick="savePerson()">
              Save
            </button>
          </td>
        </tr>
      </table>
      <p id="demo1"></p>
      <section class="list-card" style="width: auto;">
        <div class="list-header">
          <h2>Records</h2>
          <p id="p2" class="status-text">All saved people will appear here.</p>
        </div>
        <table
          id="dtable"
          class="records-table"
          border="1"
          cellpading="8"
          width= "auto"
        ></table>
      </section>
      </div>
      <section class="result-card" aria-live="polite">
        <article class="result-box">
          <form class="search-min" role="search">
        <input
          type="search"
          id="searchbox"
          placeholder="Search.."
          aria-label="Search"
        /><button type="button" id="searchBtn" onclick="search()">submit</button>
      </form>
          
          <h3>Search result</h3>
          <div id="searchResult"></div>
        </article>
        <article class="result-box">
                <div class="sort-controls">
        <label
          ><input type="radio" name="sortOrder" value="Ascending" />
          Ascending</label
        >
        <label
          ><input type="radio" name="sortOrder" value="descending" />
          Descending</label
        >
        <button type="button" id="sortBtn" onclick="objsorting()">sort</button>
      </div>
          <h3>Sort result</h3>
          <div id="sortResult">Choose Ascending or Descending and click Sort.</div>
        </article>
      </section>
      </div>
    </main>
    <script src="myscripts.js"></script>
    <p id="p3"></p>
  </body>
</html>
